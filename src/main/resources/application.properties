spring.application.name=AutoEscola3ESA

server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/autoescola3esa
spring.datasource.username=root
spring.datasource.password=fiap

api.security.token.secret=12345678

# --- Consumo de API externa (ViaCEP) ---
viacep.url=https://viacep.com.br/ws
viacep.timeout-ms=3000

# --- CORS: origens permitidas separadas por vírgula (front-ends locais de desenvolvimento) ---
api.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
